name: Recalibrate Visa Endpoints

# v4.0.0 — Runs `calibrate --all` once a week. VFS Global rotates endpoints,
# JWT issuance tokens, and Cloudflare rules every few weeks; without periodic
# recalibration the API layer slowly degrades (page-change layer keeps working).
#
# Schedule: Sunday 04:00 UTC = 09:30 IST = quiet time on most weeks. Adjust
# if you want it to land in your local off-hours.

on:
  schedule:
    - cron: '0 4 * * 0'   # Sunday 04:00 UTC
  workflow_dispatch:        # manual trigger from Actions tab

# Don't run while monitor.yml might be checking something
concurrency:
  group: visa-monitor
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # calibration can take 15-25 min on Linux runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Restore tracker state
        uses: actions/cache@v4
        with:
          path: visa_slots.db
          key: visa-state-calibrate-${{ github.run_id }}
          restore-keys: |
            visa-state-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full calibration
        run: |
          python visa_tracker_v3.py calibrate --all

      - name: Save updated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: visa_slots.db
          key: visa-state-calibrate-${{ github.run_id }}

      - name: Notify completion
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, sys
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat = os.environ.get('TELEGRAM_CHAT_ID', '')
          status = '✓ completed' if '${{ job.status }}' == 'success' else '⚠ failed'
          if token and chat:
              requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={
                      'chat_id': chat,
                      'text': f'Weekly visa tracker recalibration {status}.'
                  },
                  timeout=10,
              )
          "
